<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d">
  <title id="t">Hand span baseline</title>
  <desc id="d">Open hand with span marked from thumb tip to little-finger tip, used as a body-measurement unit.</desc>
  <rect width="800" height="480" fill="#161412"/>
  <text x="400" y="36" text-anchor="middle" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="13" letter-spacing="3">HAND SPAN METHOD</text>
  <text x="400" y="64" text-anchor="middle" fill="#e0dcd8" font-family="DM Sans,sans-serif" font-size="22" font-weight="700">One span = your personal ruler</text>

  <!-- hand outline -->
  <g transform="translate(250,100)" fill="#1c1a18" stroke="#2a2724" stroke-width="2">
    <path d="M90,280 L90,180 Q90,120 120,90 L130,40 Q135,20 145,40 L155,100
             L165,30 Q170,10 180,30 L190,105
             L200,25 Q205,5 215,28 L220,110
             L230,40 Q238,18 245,42 L248,130
             Q260,160 255,220 L250,280 Z"/>
  </g>

  <!-- span line -->
  <line x1="340" y1="140" x2="500" y2="140" stroke="#d4a84b" stroke-width="2.5"/>
  <circle cx="340" cy="140" r="6" fill="#d4a84b"/>
  <circle cx="500" cy="140" r="6" fill="#d4a84b"/>
  <text x="420" y="128" text-anchor="middle" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="14" font-weight="700">1 span</text>

  <g fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="13">
    <text x="80" y="180">1. Spread hand flat</text>
    <text x="80" y="200" fill="#8b8178">thumb tip → little finger tip</text>
    <text x="80" y="236">2. Measure that length</text>
    <text x="80" y="256" fill="#8b8178">once, in cm, on a ruler</text>
    <text x="80" y="292">3. Reuse as a unit</text>
    <text x="80" y="312" fill="#8b8178">shoulder ≈ N spans × cm</text>
  </g>

  <rect x="520" y="200" width="220" height="140" rx="10" fill="#1c1a18" stroke="#2a2724"/>
  <text x="630" y="230" text-anchor="middle" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="13" font-weight="700">Typical adult span</text>
  <text x="540" y="262" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">Men often ~18–21 cm</text>
  <text x="540" y="282" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">Women often ~16–19 cm</text>
  <text x="540" y="310" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="12">Your number beats the</text>
  <text x="540" y="328" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="12">average — measure yours.</text>

  <line x1="100" y1="440" x2="700" y2="440" stroke="#2a2724"/>
  <text x="400" y="462" text-anchor="middle" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="12">FITME · perfectfitme.com · Approximate — verify with a tape before important orders</text>
</svg>
