<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d">
  <title id="t">Arm length — upper arm and forearm</title>
  <desc id="d">Arm bent at 90 degrees with upper-arm and forearm segments marked.</desc>
  <rect width="800" height="480" fill="#161412"/>
  <text x="400" y="36" text-anchor="middle" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="13" letter-spacing="3">ARM LENGTH</text>
  <text x="400" y="64" text-anchor="middle" fill="#e0dcd8" font-family="DM Sans,sans-serif" font-size="22" font-weight="700">Upper arm + forearm</text>

  <g transform="translate(300,130)" fill="none" stroke="#2a2724" stroke-width="18" stroke-linecap="round">
    <path d="M40,20 L40,140 L160,140"/>
  </g>
  <g transform="translate(300,130)" fill="#1c1a18" stroke="#2a2724" stroke-width="2">
    <circle cx="40" cy="20" r="22"/>
  </g>

  <!-- upper arm measure -->
  <line x1="290" y1="150" x2="290" y2="270" stroke="#d4a84b" stroke-width="2"/>
  <circle cx="290" cy="150" r="5" fill="#d4a84b"/>
  <circle cx="290" cy="270" r="5" fill="#d4a84b"/>
  <text x="270" y="215" text-anchor="end" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="13" font-weight="700">upper</text>

  <!-- forearm measure -->
  <line x1="340" y1="300" x2="460" y2="300" stroke="#d4a84b" stroke-width="2"/>
  <circle cx="340" cy="300" r="5" fill="#d4a84b"/>
  <circle cx="460" cy="300" r="5" fill="#d4a84b"/>
  <text x="400" y="325" text-anchor="middle" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="13" font-weight="700">forearm</text>

  <g fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="13">
    <text x="80" y="170">1. Shoulder point → elbow</text>
    <text x="80" y="190" fill="#8b8178">acromion to elbow tip</text>
    <text x="80" y="226">2. Elbow → wrist bone</text>
    <text x="80" y="246" fill="#8b8178">not to the fingertips</text>
    <text x="80" y="282">3. Add for full sleeve</text>
    <text x="80" y="302" fill="#8b8178">compare to listed sleeve</text>
  </g>

  <rect x="520" y="160" width="220" height="120" rx="10" fill="#1c1a18" stroke="#2a2724"/>
  <text x="630" y="190" text-anchor="middle" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="13" font-weight="700">Sleeve tip</text>
  <text x="540" y="218" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">If the shoulder fits,</text>
  <text x="540" y="236" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">sleeve length is usually</text>
  <text x="540" y="254" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">an easy alteration.</text>

  <line x1="100" y1="440" x2="700" y2="440" stroke="#2a2724"/>
  <text x="400" y="462" text-anchor="middle" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="12">FITME · perfectfitme.com</text>
</svg>
