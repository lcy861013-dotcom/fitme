<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d">
  <title id="t">Hip circumference</title>
  <desc id="d">Waist-down figure with a full circumference loop at the fullest hip point.</desc>
  <rect width="800" height="480" fill="#161412"/>
  <text x="400" y="36" text-anchor="middle" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="13" letter-spacing="3">HIP CIRCUMFERENCE</text>
  <text x="400" y="64" text-anchor="middle" fill="#e0dcd8" font-family="DM Sans,sans-serif" font-size="22" font-weight="700">Fullest point, all the way around</text>

  <g transform="translate(330,100)" fill="#1c1a18" stroke="#2a2724" stroke-width="2">
    <ellipse cx="50" cy="28" rx="28" ry="32"/>
    <path d="M22,55 Q50,72 78,55 L95,160 Q50,175 5,160 Z"/>
    <path d="M20,160 L10,300 L40,300 L50,200 L60,300 L90,300 L80,160"/>
  </g>

  <!-- hip loop -->
  <ellipse cx="380" cy="255" rx="78" ry="22" fill="none" stroke="#d4a84b" stroke-width="2.5"/>
  <circle cx="302" cy="255" r="6" fill="#d4a84b"/>
  <circle cx="458" cy="255" r="6" fill="#d4a84b"/>
  <text x="380" y="295" text-anchor="middle" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="14" font-weight="700">hip circ. (full loop)</text>

  <g fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="13">
    <text x="80" y="180">1. Stand feet together</text>
    <text x="80" y="200" fill="#8b8178">weight even on both</text>
    <text x="80" y="236">2. Find the fullest seat</text>
    <text x="80" y="256" fill="#8b8178">usually below the waist</text>
    <text x="80" y="292">3. Loop once — level</text>
    <text x="80" y="312" fill="#8b8178">tape parallel to floor</text>
  </g>

  <rect x="520" y="170" width="220" height="140" rx="10" fill="#1c1a18" stroke="#2a2724"/>
  <text x="630" y="200" text-anchor="middle" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="13" font-weight="700">Flat chart tip</text>
  <text x="540" y="230" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">Many listings show hip</text>
  <text x="540" y="248" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">as a half (flat) number.</text>
  <text x="540" y="274" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">Your body measure is</text>
  <text x="540" y="292" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">full circumference.</text>

  <line x1="100" y1="440" x2="700" y2="440" stroke="#2a2724"/>
  <text x="400" y="462" text-anchor="middle" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="12">FITME · perfectfitme.com</text>
</svg>
