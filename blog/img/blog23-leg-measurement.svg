<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d">
  <title id="t">Leg length — hip bone to ankle</title>
  <desc id="d">Standing figure with greater trochanter and ankle marked, measuring inseam-related length.</desc>
  <rect width="800" height="480" fill="#161412"/>
  <text x="400" y="36" text-anchor="middle" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="13" letter-spacing="3">LEG LENGTH</text>
  <text x="400" y="64" text-anchor="middle" fill="#e0dcd8" font-family="DM Sans,sans-serif" font-size="22" font-weight="700">Greater trochanter → ankle</text>

  <g transform="translate(340,90)" fill="#1c1a18" stroke="#2a2724" stroke-width="2">
    <ellipse cx="40" cy="28" rx="28" ry="32"/>
    <path d="M20,55 Q40,70 60,55 L70,160 L55,300 L40,300 L25,300 L10,160 Z"/>
  </g>

  <line x1="300" y1="250" x2="300" y2="390" stroke="#d4a84b" stroke-width="2.5"/>
  <circle cx="300" cy="250" r="7" fill="#d4a84b"/>
  <circle cx="300" cy="390" r="7" fill="#d4a84b"/>
  <text x="285" y="245" text-anchor="end" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="12" font-weight="700">hip bone</text>
  <text x="285" y="400" text-anchor="end" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="12" font-weight="700">ankle</text>
  <text x="255" y="325" text-anchor="end" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="14" font-weight="700">leg length</text>

  <g fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="13">
    <text x="80" y="180">1. Find the hip bone bump</text>
    <text x="80" y="200" fill="#8b8178">side of the upper thigh</text>
    <text x="80" y="236">2. Drop straight to ankle</text>
    <text x="80" y="256" fill="#8b8178">outer ankle bone</text>
    <text x="80" y="292">3. Compare to inseam</text>
    <text x="80" y="312" fill="#8b8178">inseam is crotch→hem —</text>
    <text x="80" y="330" fill="#8b8178">related, not identical</text>
  </g>

  <rect x="500" y="160" width="240" height="130" rx="10" fill="#1c1a18" stroke="#2a2724"/>
  <text x="620" y="190" text-anchor="middle" fill="#d4a84b" font-family="DM Sans,sans-serif" font-size="13" font-weight="700">Height illusion</text>
  <text x="520" y="220" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">Rise and hem change how</text>
  <text x="520" y="238" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">long the leg reads more</text>
  <text x="520" y="256" fill="#c8c4c0" font-family="DM Sans,sans-serif" font-size="12">than actual bone length.</text>

  <line x1="100" y1="440" x2="700" y2="440" stroke="#2a2724"/>
  <text x="400" y="462" text-anchor="middle" fill="#8b8178" font-family="DM Sans,sans-serif" font-size="12">FITME · perfectfitme.com</text>
</svg>
